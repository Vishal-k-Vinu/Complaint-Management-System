services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: complaint-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - complaint-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: complaint-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - complaint-network

networks:
  complaint-network:
    driver: bridge